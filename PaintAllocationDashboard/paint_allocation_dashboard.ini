; Paint Allocation Dashboard configuration
; -----------------------------------------
; Every path is RELATIVE to THIS file's own folder, so the build stays portable
; across machines (each coworker's OneDrive mounts under a different C:\Users\...).
; This file is optional — delete it and the dashboard auto-resolves everything.

[paths]
; Project root = the folder that holds the raw-data folders (Inventory, Releases,
; Process Routings, Part Attributes, BOM) and the existing Allocations\.
; Default: one level above this config (i.e. Production Planning\).
; Leave blank to let the dashboard auto-detect by walking up the tree.
project_root = ..

[server]
host = 127.0.0.1   ; local-only; never exposed on the LAN, no firewall change
port = 0           ; 0 = auto-pick a free port each launch (avoids clashes)

[refresh]
; Auto-rebuild when new files are pulled from the ERP (folders change).
; The dashboard watches the raw-data folders and refreshes once a pull settles;
; the browser then updates on its own within ~15s. Set false to require the
; manual Refresh-data button only.
auto_update = true

[shared]
; Shared root for cross-machine files: the snapshot pool (and, in a future build, the
; floor runlists / saved-views bank / writer lock). Path is RELATIVE to THIS file.
; Leave blank to keep everything LOCAL to this folder (default; zero-config).
; Point this at a OneDrive/network folder all planners can read+write to share them.
dir =
