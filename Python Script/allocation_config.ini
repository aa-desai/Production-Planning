# Configuration for the paint-allocation tools (read by allocation_common.py).
#
# Every value below already matches the live folder layout and plant codes, so the
# tools run correctly even if this file is absent — it exists to make these values
# explicit and editable without touching code.
#
# Search order (first file found wins): next to allocation_common.py / the running
# .exe, then one level up, then the project root. To override values for a packaged
# .exe, place a copy of this file next to that .exe.
#
# Folder names are resolved relative to the project root (the folder that contains
# Inventory\, Releases\, etc.).

[folders]
inventory_p6     = Inventory P6
inventory_p10    = Inventory
releases         = Releases
process_routings = Process Routings
part_attributes  = Part Attributes
bom              = BOM
exploded_bom     = Exploded BOM
flat_bom         = Flat BOM
allocations      = Allocations

[plants]
p6           = P6
p10          = P10
p10_location = Modineer - P10
